# Production control plane. One management host (phase 0) or one VM per role (phase 1) runs this.
# Secrets and settings come from /etc/prgd/prgd.env, rendered by Ansible. Nothing here is
# customer facing except through Caddy, which terminates TLS for the public hostnames.
#
#   docker compose --env-file /etc/prgd/prgd.env -f docker-compose.yml up -d
name: prgd

x-api: &api
  image: ${REGISTRY:-ghcr.io/sharpyassir}/prgd-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: [/etc/prgd/prgd.env]
  environment:
    DATABASE_URL: postgresql://prgd:${POSTGRES_PASSWORD}@postgres:5432/prgd
    REDIS_URL: redis://redis:6379
    NATS_URL: nats://nats:4222
    NATS_TOKEN: ${NATS_TOKEN}
    TEMPORAL_ADDRESS: temporal:7233
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    nats: { condition: service_started }
    temporal: { condition: service_started }
  networks: [internal]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [api, console, www, ops, gateway]

  api:
    <<: *api
    command: ["node", "dist/main.js"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    # Managed cloud maintenance playbooks (MAINTENANCE_PLAYBOOK_DIR), copied here by Ansible.
    volumes:
      - ./maintenance:/opt/prgd/maintenance:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One shot: runs pending migrations, then exits. `deploy.sh` runs it before restarting api and worker.
  migrate:
    <<: *api
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
    profiles: [ops]

  # One shot: region, plans, prices, images and marketplace apps. Safe to rerun; never adds demo data here.
  seed:
    <<: *api
    command: ["node_modules/.bin/ts-node", "--transpile-only", "prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://prgd:${POSTGRES_PASSWORD}@postgres:5432/prgd
      SEED_DEMO: "false"
    restart: "no"
    profiles: [ops]

  # One shot: promote a signed up account to full staff.  run --rm staff you@progrid.sa
  staff:
    <<: *api
    entrypoint: ["node_modules/.bin/ts-node", "--transpile-only", "prisma/make-staff.ts"]
    command: []
    restart: "no"
    profiles: [ops]

  console:
    image: ${REGISTRY:-ghcr.io/sharpyassir}/prgd-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  www:
    image: ${REGISTRY:-ghcr.io/sharpyassir}/prgd-www:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # Terminal gateway of the DevOps console (services/prgd-gateway). Caddy publishes only its
  # WebSocket endpoint at gateway.$DOMAIN; it calls the API's /internal/gateway on this network.
  # It also opens SSH to asset management addresses over WireGuard: the host must route the
  # management network (docs/devops-console.md, "Running the gateway").
  gateway:
    image: ${REGISTRY:-ghcr.io/sharpyassir}/prgd-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Only its own settings (from --env-file), not the whole prgd.env: the gateway faces the
    # internet and needs no database, mail or payment secrets.
    environment:
      PRGD_API_URL: http://api:4000
      PRGD_GATEWAY_SECRET: ${PRGD_GATEWAY_SECRET}
      PRGD_GATEWAY_ID: ${PRGD_GATEWAY_ID:-gw-1}
      PRGD_GATEWAY_ALLOWED_ORIGINS: ${PRGD_GATEWAY_ALLOWED_ORIGINS:-https://ops.progrid.sa}
      PRGD_GATEWAY_KNOWN_HOSTS: ${PRGD_GATEWAY_KNOWN_HOSTS:-}
      PRGD_GATEWAY_MAX_SESSIONS: ${PRGD_GATEWAY_MAX_SESSIONS:-50}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN}
    volumes:
      # Recordings are spooled here until uploaded; a failed upload stays for an operator.
      - gateway-spool:/var/lib/prgd-gateway/spool
      # Optional known_hosts (PRGD_GATEWAY_KNOWN_HOSTS=/etc/prgd-gateway/known_hosts).
      - ./gateway:/etc/prgd-gateway:ro
    depends_on:
      api: { condition: service_started }
      nats: { condition: service_started }
    # Time to end sessions and upload their recordings on a restart.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  # The DevOps console for on call engineers (apps/ops), published by Caddy at ops.$DOMAIN.
  # It holds no secrets: everything goes through the API with the engineer's own session.
  ops:
    image: ${REGISTRY:-ghcr.io/sharpyassir}/prgd-ops:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prgd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prgd
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=test ! -f /var/backups/prgd/wal/%f && cp %p /var/backups/prgd/wal/%f", "-c", "archive_timeout=300"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prgd"]
      interval: 10s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    networks: [internal]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # JetStream on; host agents on the Proxmox nodes connect over the management network on :4222
    command: ["-js", "-sd", "/data", "-m", "8222", "--auth", "${NATS_TOKEN}"]
    ports: ["${MGMT_IP}:4222:4222"]
    volumes: [nats-data:/data]
    networks: [internal]

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: prgd
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/progrid.yaml
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/progrid.yaml:ro
    networks: [internal]

  # Authoritative nameserver. Runs on the management host in phase 0; in phase 1 run one on
  # each of two hosts (ns1, ns2) against the same schema, both pointed at the API through
  # PDNS_API_URL. Load the schema once: docker compose exec postgres psql -U prgd -d pdns
  #   -f /usr/local/share/doc/pdns/schema.pgsql.sql (copy it out of the pdns image).
  pdns:
    image: powerdns/pdns-auth-49:4.9.4
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY}
      PDNS_launch: gpgsql
      PDNS_gpgsql_host: postgres
      PDNS_gpgsql_user: prgd
      PDNS_gpgsql_password: ${POSTGRES_PASSWORD}
      PDNS_gpgsql_dbname: pdns
      PDNS_api: "yes"
      PDNS_webserver: "yes"
      PDNS_webserver_address: 0.0.0.0
      PDNS_webserver_allow_from: 0.0.0.0/0
      PDNS_default_soa_content: "ns1.@ hostmaster.@ 0 10800 3600 604800 3600"
    ports: ["53:53/udp", "53:53/tcp"]
    networks: [internal]
    profiles: [dns]

  # Internal only: reach it over an SSH tunnel (ssh -L 8080:127.0.0.1:8080 mgmt), never exposed by Caddy.
  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal]

  # Nightly logical backup of Postgres to /var/backups/prgd (and to S3 compatible storage when configured).
  backup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_URL: ${BACKUP_S3_URL:-}
      # The rclone remote "offsite" for any S3 compatible storage (DigitalOcean Spaces, Backblaze B2, Wasabi, AWS).
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
      PRGD_API_URL: http://api:4000
      PRGD_PLATFORM_HEARTBEAT_SECRET: ${PRGD_PLATFORM_HEARTBEAT_SECRET:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - /var/backups/prgd:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redis-data:
  nats-data:
  caddy-data:
  caddy-config:
  gateway-spool:
