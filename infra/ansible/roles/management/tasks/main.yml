- name: Base packages
  apt:
    name: [ca-certificates, curl, gnupg, ufw, unattended-upgrades, fail2ban, python3-docker]
    update_cache: true

# Swap as a safety margin for memory spikes on small hosts. Created once; skipped when swap exists.
- name: Swap file
  shell: |
    fallocate -l {{ swap_size | default('2G') }} /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  args: { creates: /swapfile }
  when: ansible_swaptotal_mb | int == 0

- name: Prefer memory over swap
  copy: { dest: /etc/sysctl.d/60-swappiness.conf, content: "vm.swappiness = 10\n", mode: "0644" }
  notify: apply sysctl

- name: Docker apt key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args: { creates: /etc/apt/keyrings/docker.gpg }

- name: Docker apt repo
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker

- name: Docker engine and compose plugin
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true

- name: Directories
  file: { path: "{{ item }}", state: directory, mode: "0750" }
  loop: [/opt/pgcloud, /etc/pgcloud, /var/backups/pgcloud]

- name: Compose bundle
  copy: { src: "{{ playbook_dir }}/../prod/{{ item }}", dest: "/opt/pgcloud/{{ item }}", mode: "0640" }
  loop: [docker-compose.yml, Caddyfile, backup.sh]
  notify: compose up

- name: Deploy script
  copy: { src: "{{ playbook_dir }}/../prod/deploy.sh", dest: /opt/pgcloud/deploy.sh, mode: "0750" }

- name: Environment file from the vault
  template: { src: pgcloud.env.j2, dest: /etc/pgcloud/pgcloud.env, mode: "0600" }
  notify: compose up

- name: Registry login (private images only)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_user }}"
    password: "{{ vault_ghcr_token }}"
  when: vault_ghcr_user | default('') | length > 0

- name: Firewall defaults
  community.general.ufw: { state: enabled, policy: deny, direction: incoming }

- name: Firewall allow web and ssh
  community.general.ufw: { rule: allow, port: "{{ item }}", proto: tcp }
  loop: ["80", "443", "22"]

- name: Firewall allow QUIC
  community.general.ufw: { rule: allow, port: "443", proto: udp }

- name: Firewall allow NATS from the management network only
  community.general.ufw: { rule: allow, port: "4222", proto: tcp, src: "{{ mgmt_cidr | default('10.0.0.0/24') }}" }

- name: Restrict ssh sources when configured
  community.general.ufw: { rule: allow, port: "22", proto: tcp, src: "{{ item }}" }
  loop: "{{ ssh_allow_from }}"
  when: ssh_allow_from | length > 0

- name: Deploy tool for the CI user
  copy:
    dest: /etc/sudoers.d/pgcloud-deploy
    mode: "0440"
    content: "{{ ansible_user }} ALL=(root) NOPASSWD: /opt/pgcloud/deploy.sh\n"
    validate: visudo -cf %s

- name: First start
  shell: /opt/pgcloud/deploy.sh {{ image_tag }}
  args: { creates: /var/lib/docker/volumes/pgcloud_pgdata }
