- name: Base packages
  apt:
    name: [ca-certificates, curl, gnupg, ufw, unattended-upgrades, fail2ban, python3-docker]
    update_cache: true

# Swap as a safety margin for memory spikes on small hosts. Created once; skipped when swap exists.
- name: Swap file
  shell: |
    fallocate -l {{ swap_size | default('2G') }} /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  args: { creates: /swapfile }
  when: ansible_swaptotal_mb | int == 0

- name: Prefer memory over swap
  copy: { dest: /etc/sysctl.d/60-swappiness.conf, content: "vm.swappiness = 10\n", mode: "0644" }
  notify: apply sysctl

- name: Docker apt key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args: { creates: /etc/apt/keyrings/docker.gpg }

- name: Docker apt repo
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker

- name: Docker engine and compose plugin
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true

- name: Directories
  file: { path: "{{ item }}", state: directory, mode: "0750" }
  loop: [/opt/prgd, /etc/prgd, /var/backups/prgd]

# Postgres archives WAL here (archive_command in docker-compose.yml) as the container's postgres
# user; the backup container reads the same directory as /backups/wal and copies it off the server.
- name: WAL archive directory
  file:
    path: /var/backups/prgd/wal
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ postgres_container_uid }}"
    mode: "0700"

# NATS is published on the WireGuard address (MGMT_IP). Docker can only bind it once wg0 exists,
# so Docker must start after the tunnel at boot. The wireguard play brings wg0 up before this role.
- name: Docker starts after WireGuard
  block:
    - name: Docker drop-in directory
      file: { path: /etc/systemd/system/docker.service.d, state: directory, mode: "0755" }
    - name: Docker drop-in
      copy:
        dest: /etc/systemd/system/docker.service.d/10-after-wireguard.conf
        mode: "0644"
        content: |
          [Unit]
          After=wg-quick@{{ wireguard_interface }}.service
          Wants=wg-quick@{{ wireguard_interface }}.service
      notify: systemd daemon-reload
  when: wireguard_address is defined

# No secrets in these files (those live in /etc/prgd/prgd.env); containers that run as a
# normal user, such as Temporal, must be able to read the files mounted into them.
- name: Compose bundle
  copy: { src: "{{ playbook_dir }}/../prod/{{ item }}", dest: "/opt/prgd/{{ item }}", mode: "0644" }
  loop: [docker-compose.yml, Caddyfile, backup.sh, temporal-dynamicconfig.yaml]
  notify: compose up

- name: Managed cloud maintenance playbooks (mounted into the worker)
  copy: { src: "{{ playbook_dir }}/maintenance/", dest: /opt/prgd/maintenance/, mode: "0644", directory_mode: "0755" }

- name: Terminal gateway directory (mounted read only at /etc/prgd-gateway)
  file: { path: /opt/prgd/gateway, state: directory, mode: "0755" }

# Host keys of the managed assets, OpenSSH known_hosts format. After a change:
#   docker compose --env-file /etc/prgd/prgd.env -f docker-compose.yml kill -s HUP gateway
- name: Terminal gateway known_hosts
  copy: { content: "{{ prgd_gateway_known_hosts }}", dest: /opt/prgd/gateway/known_hosts, mode: "0644" }
  when: prgd_gateway_known_hosts is defined

- name: Deploy script
  copy: { src: "{{ playbook_dir }}/../prod/deploy.sh", dest: /opt/prgd/deploy.sh, mode: "0750" }

- name: Environment file from the vault
  template: { src: prgd.env.j2, dest: /etc/prgd/prgd.env, mode: "0600" }
  notify: compose up

- name: Registry login (private images only)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_user }}"
    password: "{{ vault_ghcr_token }}"
  when: vault_ghcr_user | default('') | length > 0

- name: Firewall defaults
  community.general.ufw: { state: enabled, policy: deny, direction: incoming }

- name: Firewall allow web
  community.general.ufw: { rule: allow, port: "{{ item }}", proto: tcp }
  loop: ["80", "443"]

- name: Firewall allow QUIC
  community.general.ufw: { rule: allow, port: "443", proto: udp }

# Docker publishes ports past ufw, so what really limits NATS is the bind address (MGMT_IP, the
# WireGuard address); this rule documents the intent and covers a NATS run outside Docker.
- name: Firewall allow NATS from the management network only
  community.general.ufw: { rule: allow, port: "4222", proto: tcp, src: "{{ wireguard_cidr if wireguard_address is defined else (mgmt_cidr | default('10.0.0.0/24')) }}" }

# Note on DOCKER-USER: ports published by Docker (Caddy 80/443, PowerDNS 53, NATS on MGMT_IP,
# Temporal UI on 127.0.0.1) are filtered in iptables' DOCKER-USER chain, never by these ufw rules.
# Every published port is meant to be reachable or is bound to a private address, so nothing is
# added there; anything that must be filtered by source goes into DOCKER-USER, not ufw.

# SSH: with ssh_allow_from set, only those sources and the management network. The source rules
# go in before the open rule is deleted, and ufw keeps established sessions, so a run never cuts
# the operator's own connection.
- name: Firewall allow ssh from the allowed sources
  community.general.ufw: { rule: allow, port: "22", proto: tcp, src: "{{ item }}" }
  loop: "{{ ssh_allow_from + [wireguard_cidr] }}"
  when: ssh_allow_from | length > 0

- name: Firewall no ssh from anywhere else
  community.general.ufw: { rule: allow, port: "22", proto: tcp, delete: true }
  when: ssh_allow_from | length > 0

# Without ssh_allow_from 22 stays open to the world rather than lock anyone out.
- name: Firewall allow ssh from anywhere (ssh_allow_from is empty)
  community.general.ufw: { rule: allow, port: "22", proto: tcp }
  when: ssh_allow_from | length == 0

- name: SSH is open to the internet
  debug:
    msg: >-
      WARNING: ssh_allow_from is empty, so port 22 accepts connections from anywhere. Set it to the
      operators' CIDRs in group_vars (docs/security/infra-hardening.md) and re-run.
  when: ssh_allow_from | length == 0

# ---- deploy user for the GitHub workflow ----

# No password ("*" can never match, unlike "!" it does not lock key login under UsePAM) and a
# real shell, which sshd needs to run the forced command.
- name: Deploy user
  user:
    name: "{{ deploy_user }}"
    shell: /bin/sh
    password: "*"
    create_home: true
    system: false

# Owned by root, so the deploy user cannot change its own keys. The key runs nothing but the deploy
# script; the image tag the workflow sends arrives in SSH_ORIGINAL_COMMAND (infra/prod/deploy.sh).
- name: Deploy user's ssh directory
  file: { path: "/home/{{ deploy_user }}/.ssh", state: directory, owner: root, group: "{{ deploy_user }}", mode: "0755" }
  when: deploy_authorized_key is defined

- name: Deploy user's key, forced to the deploy script
  copy:
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0644"
    content: |
      # Managed by Ansible (role management). Only runs the deploy script; see infra/prod/deploy.sh.
      command="sudo -n /opt/prgd/deploy.sh",restrict {{ deploy_authorized_key | trim }}
  when: deploy_authorized_key is defined

# The deploy user may run the deploy script without arguments only ("" in sudoers); the tag comes
# from SSH_ORIGINAL_COMMAND, which sudo would otherwise strip from the environment.
- name: Deploy tool for the CI user
  copy:
    dest: /etc/sudoers.d/prgd-deploy
    mode: "0440"
    content: |
      # Managed by Ansible (role management).
      Defaults!/opt/prgd/deploy.sh env_keep += "SSH_ORIGINAL_COMMAND"
      {{ deploy_user }} ALL=(root) NOPASSWD: /opt/prgd/deploy.sh ""
      {% if legacy_ci_deploy_user | bool and (legacy_ci_user | default(ansible_user | default(''))) | length > 0 %}
      # Legacy: CI used to log in as the Ansible user. Remove with legacy_ci_deploy_user: false once
      # the DEPLOY_USER secret is the deploy user.
      {{ legacy_ci_user | default(ansible_user) }} ALL=(root) NOPASSWD: /opt/prgd/deploy.sh
      {% endif %}
    validate: visudo -cf %s

- name: First start
  shell: /opt/prgd/deploy.sh {{ image_tag }}
  args: { creates: /var/lib/docker/volumes/prgd_pgdata }
