# Ansible runs on the management host itself (repository cloned at /opt/progrid-src), so the
# management host is a local connection and the Proxmox nodes are reached over SSH as root.
#
# wireguard_address: this host's address on the management network (10.9.0.0/24): .1 is the
#   management host, nodes take .2 and up. NATS listens on the management address.
# wireguard_endpoint: the public IPv4 the other side sends WireGuard packets to (UDP 51820).
#   Nodes default to ansible_host.

[management]
mgmt1 ansible_connection=local mgmt_ip=10.114.0.2 wireguard_address=10.9.0.1 wireguard_endpoint=203.0.113.10

[pve_nodes]
# pve_node_name must be the node's hostname; host_id is the Host id from the back office.
pve1 ansible_host=198.51.100.20 pve_node_name=pve1 host_id=REPLACE_WITH_Host.id wireguard_address=10.9.0.2

[pve_nodes:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/progrid_pve

[all:vars]
ansible_python_interpreter=/usr/bin/python3
