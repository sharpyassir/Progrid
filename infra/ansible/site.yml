# WireGuard first: the management host publishes NATS on its WireGuard address, so wg0 must be
# up before the management role (re)starts the compose stack, and the nodes reach NATS over it.
# Hosts without wireguard_address in the inventory are left alone (NATS stays on mgmt_ip).
- name: Management network (WireGuard)
  hosts: management:pve_nodes
  become: true
  roles:
    - role: wireguard
      when: wireguard_address is defined

# Operating system baseline (SSH, sysctl, NTP, patching, fail2ban, auditd, journald) on every
# host; docs/security/infra-hardening.md. After WireGuard, so the tunnel is up before sshd and
# the kernel settings change. Run it alone with --tags baseline.
- name: Operating system baseline
  hosts: management:pve_nodes
  become: true
  roles:
    - role: baseline
      tags: [baseline]

- name: Control plane host
  hosts: management
  become: true
  roles: [management]

- name: Proxmox nodes
  hosts: pve_nodes
  become: true
  roles: [pve_node]
