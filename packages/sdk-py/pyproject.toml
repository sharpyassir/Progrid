[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prgd"
version = "0.1.0"
description = "Python client for the prgd API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Documentation = "https://progrid.co/docs/api"

[tool.setuptools.packages.find]
include = ["prgd*"]
