name: deploy

# Every push to main builds the three control plane images and tags them with the commit sha
# (and `latest`). A tag `v*` also tags them with the version. The deploy job then rolls the
# management host over SSH, which pulls the images, runs migrations and restarts.
#
# Secrets (repository settings):
#   DEPLOY_HOST   management host address        DEPLOY_USER  ssh user (the Ansible user)
#   DEPLOY_SSH_KEY  private key for that user
# The public addresses baked into the website and console default to progrid.sa. Override them with
# repository variables PUBLIC_API_URL, PUBLIC_CONSOLE_URL and PUBLIC_WWW_URL for another domain.
# Set the `production` environment to require a reviewer if you want a manual gate.
# Images are only built after the ci workflow succeeded for the same commit, so a failing
# commit never reaches the host.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, console, www]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pgcloud-${{ matrix.app }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.progrid.sa' }}
            NEXT_PUBLIC_CONSOLE_URL=${{ vars.PUBLIC_CONSOLE_URL || 'https://console.progrid.sa' }}
            NEXT_PUBLIC_WWW_URL=${{ vars.PUBLIC_WWW_URL || 'https://progrid.sa' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    # The secrets context is not allowed in a job condition, so the check happens in a step.
    steps:
      - id: gate
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "DEPLOY_HOST is not set; skipping the roll"; fi
      - name: Roll the management host
        if: steps.gate.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo /opt/pgcloud/deploy.sh ${{ github.ref_type == 'tag' && github.ref_name || format('{0}', github.event.workflow_run.head_sha || github.sha) }}
