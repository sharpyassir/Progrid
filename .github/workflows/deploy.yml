name: deploy

# Every push to main builds the control plane images and tags them with the commit sha
# (and `latest`). A tag `v*` also tags them with the version. The deploy job then rolls the
# management host over SSH, which pulls the images, runs migrations and restarts.
#
# Secrets (repository settings):
#   DEPLOY_HOST   management host address        DEPLOY_USER  ssh user (the `deploy` user, not root)
#   DEPLOY_SSH_KEY  private key for that user      DEPLOY_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <host>`
#                                                   output, checked before the key is ever used
# The deploy user's authorized_keys line is restricted to the deploy script (infra/prod/deploy.sh,
# docs/security/deploy-pipeline.md), so the key cannot open a shell even if it leaks.
# The website, the console and the ops console derive their addresses at runtime from the host
# they are served on (console.X talks to api.X), so one build serves progrid.co and progrid.sa.
# The build time addresses below are only the fallback for other hosts and default to progrid.co,
# the primary domain. Override them with repository variables PUBLIC_API_URL, PUBLIC_CONSOLE_URL,
# PUBLIC_WWW_URL, PUBLIC_OPS_URL and PUBLIC_GATEWAY_URL (wss://). GEOIP_MONTH makes the www and api
# images fetch the current DB-IP country database once a month (docs/domains-and-entities.md).
# Set the `production` environment to require a reviewer if you want a manual gate.
# Images are only built after the ci workflow succeeded for the same commit, so a failing
# commit never reaches the host.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    # A workflow_run only counts when ci ran for a push to main of this repository. A pull request
    # from a fork whose branch is also called main must never be built or deployed.
    if: >-
      ${{ github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        # app names the image (prgd-<app>); dockerfile is relative to the workspace root.
        include:
          - { app: api, dockerfile: apps/api/Dockerfile }
          - { app: console, dockerfile: apps/console/Dockerfile }
          - { app: www, dockerfile: apps/www/Dockerfile }
          - { app: gateway, dockerfile: services/prgd-gateway/Dockerfile }
          - { app: ops, dockerfile: apps/ops/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: month
        run: echo "geoip=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/prgd-${{ matrix.app }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.progrid.co' }}
            NEXT_PUBLIC_CONSOLE_URL=${{ vars.PUBLIC_CONSOLE_URL || 'https://console.progrid.co' }}
            NEXT_PUBLIC_WWW_URL=${{ vars.PUBLIC_WWW_URL || 'https://progrid.co' }}
            NEXT_PUBLIC_OPS_URL=${{ vars.PUBLIC_OPS_URL || 'https://ops.progrid.co' }}
            NEXT_PUBLIC_GATEWAY_URL=${{ vars.PUBLIC_GATEWAY_URL || 'wss://gateway.progrid.co' }}
            GEOIP_MONTH=${{ steps.month.outputs.geoip }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max
          sbom: true
      # Known critical vulnerabilities with a fix available stop the release (control 74/84).
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/prgd-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/prgd-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      # Passed through the environment, never pasted into a shell line (no expression injection).
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Roll the management host
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "DEPLOY_HOST is not set; skipping the roll"; exit 0; fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then echo "DEPLOY_KNOWN_HOSTS is not set; refusing to connect to an unverified host"; exit 1; fi
          case "$TAG" in *[!A-Za-z0-9._-]*|"") echo "refusing tag: $TAG"; exit 1 ;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "$TAG"
          rm -f ~/.ssh/deploy
