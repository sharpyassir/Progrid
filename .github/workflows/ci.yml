name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read only: pull requests from forks run here too.
permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_USER: prgd, POSTGRES_PASSWORD: prgd, POSTGRES_DB: prgd }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U prgd" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://prgd:prgd@localhost:5432/prgd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prgd/api prisma:generate
      - run: pnpm --filter @prgd/api prisma:deploy
      - run: pnpm --filter @prgd/api seed
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @prgd/api build
      - run: pnpm --filter @prgd/console build
        env: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
      - run: pnpm --filter @prgd/ops build
        env: { NEXT_PUBLIC_API_URL: http://localhost:4000 }

  integration:
    # End to end against the fake driver: the API and the Temporal worker in process, a real
    # Postgres, Redis, NATS and a Temporal dev server. See apps/api/README.md (Integration tests).
    needs: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_USER: prgd, POSTGRES_PASSWORD: prgd, POSTGRES_DB: prgd }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U prgd" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      nats:
        image: nats:2.10
        ports: ["4222:4222"]
    env:
      DATABASE_URL: postgresql://prgd:prgd@localhost:5432/prgd
      IT_DATABASE_URL: postgresql://prgd:prgd@localhost:5432/prgd_test
      IT_REDIS_URL: redis://localhost:6379/5
      NATS_URL: nats://localhost:4222
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prgd/api prisma:generate
      - name: Start a Temporal dev server
        run: |
          curl -fsSL -o /tmp/temporal.tar.gz "https://temporal.download/cli/archive/latest?platform=linux&arch=amd64"
          tar -xzf /tmp/temporal.tar.gz -C /tmp temporal
          nohup /tmp/temporal server start-dev --headless --ip 127.0.0.1 --port 7233 --db-filename /tmp/temporal.db > /tmp/temporal.log 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null && exit 0; sleep 1; done
          cat /tmp/temporal.log; exit 1
      - run: pnpm --filter @prgd/api test:integration
      - if: failure()
        run: tail -n 200 /tmp/temporal.log

  sdk-python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/sdk-py } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest -v

  terraform-provider:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/provider } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: terraform/provider/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -o terraform-provider-prgd .

  host-agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agents/host-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: agents/host-agent/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 5m
      - run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o host-agent .
      - uses: actions/upload-artifact@v4
        with: { name: host-agent-linux-amd64, path: agents/host-agent/host-agent }

  cli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)" && go vet ./... && go build -o prgd .

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1 lint packages/openapi/openapi.yaml
