name: security

# Security gates (docs/security/secure-development-lifecycle.md): static analysis, leaked secrets,
# vulnerable dependencies and infrastructure misconfiguration. Runs on every pull request, every
# push to main and weekly, so new advisories against unchanged code are found too.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with: { go-version: "1.24" }
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - if: matrix.language == 'go'
        run: |
          for d in agents/host-agent cli terraform/provider; do (cd "$d" && go build ./...); done
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{ matrix.language }}" }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --config .gitleaks.toml .

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Production dependencies with a known high or critical advisory fail the build.
      - run: pnpm audit --prod --audit-level high
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for d in agents/host-agent cli terraform/provider; do (cd "$d" && "$(go env GOPATH)/bin/govulncheck" ./...); done

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  # Dockerfiles, compose files, workflows and Ansible: misconfigurations rated high or critical.
  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-config.sarif, category: trivy-config }
