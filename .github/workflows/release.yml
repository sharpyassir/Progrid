name: release

# Tag `v1.2.3` → cross-compile the CLI and host agent, attach tarballs to a GitHub Release.
# `curl -fsSL https://get.prgd.example | sh` downloads prgd_<os>_<arch>.tar.gz from here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { dir: cli, name: prgd, os: linux, arch: amd64 }
          - { dir: cli, name: prgd, os: linux, arch: arm64 }
          - { dir: cli, name: prgd, os: darwin, arch: amd64 }
          - { dir: cli, name: prgd, os: darwin, arch: arm64 }
          - { dir: cli, name: prgd, os: windows, arch: amd64 }
          - { dir: agents/host-agent, name: host-agent, os: linux, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: build
        working-directory: ${{ matrix.dir }}
        env: { GOOS: "${{ matrix.os }}", GOARCH: "${{ matrix.arch }}", CGO_ENABLED: "0" }
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.name }}${ext}" .
          if [ "$GOOS" = windows ]; then zip "${{ matrix.name }}_${GOOS}_${GOARCH}.zip" "${{ matrix.name }}${ext}"; else tar -czf "${{ matrix.name }}_${GOOS}_${GOARCH}.tar.gz" "${{ matrix.name }}"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.dir }}/${{ matrix.name }}_*.tar.gz
            ${{ matrix.dir }}/${{ matrix.name }}_*.zip
          generate_release_notes: true
