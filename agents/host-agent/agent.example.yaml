# /etc/prgd/agent.yaml — one per Proxmox node. Deployed by Ansible (infra/ansible, role pve_node).
host_id: "clx…"                       # Host.id from POST /admin/v1/hosts
nats_url: "nats://10.0.0.10:4222"     # management network only
nats_creds: "/etc/prgd/agent.creds"
heartbeat: 60s
proxmox:
  url: "https://127.0.0.1:8006"
  node: "pve1"
  token_id: "prgd@pve!agent"
  # token_secret: from env PVE_TOKEN_SECRET (Vault agent template), never in this file
  storage: "vm-disks"                  # storage id for VM disks and volumes
  storage_type: "rbd"                  # rbd (Ceph, default) or lvmthin (single node lab, docs/first-proxmox-node.md)
  ceph_pool: "vm-disks"                # rbd only: Ceph pool behind that storage; rbd resize of detached volumes runs on it
  bridge: "customers"                  # shared private bridge; per project VNets come from the control plane
  public_bridge: "vmbr0"               # carries our public IP blocks
  # TLS to the PVE API: verify against the cluster CA, or pin the node certificate's SHA-256
  # fingerprint (`pvenode cert info`); either keeps verification on with the self-signed PVE cert.
  ca_file: "/etc/pve/pve-root-ca.pem"
  # fingerprint: "AB:CD:...:EF"
  # insecure: true                     # lab only: skips verification; ignored when ca_file or fingerprint is set
